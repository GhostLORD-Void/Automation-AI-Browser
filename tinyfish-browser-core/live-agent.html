<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TinyFish Live Agent</title>
<style>
body{margin:0;background:#090e18;color:#edf3ff;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 18px}section{background:#151e2d;border:1px solid #34435a;border-radius:16px;padding:20px;margin:18px 0}p{color:#b7c4d8;line-height:1.5}label{display:block;margin:14px 0 6px;font-size:13px;color:#c4d1e5}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #3c4a61;border-radius:8px;background:#080d15;color:white;font:inherit}button{padding:12px 16px;border:0;border-radius:8px;background:#65e0b0;color:#062018;font-weight:700;margin:14px 8px 0 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070a10;border-radius:10px;padding:14px;min-height:90px;color:#dce8fb}.tag{color:#65e0b0;font-size:12px;font-weight:bold;letter-spacing:.15em}
</style><main><div class="tag">TINYFISH · BROWSER CORE</div><h1>Live website extraction</h1><p>Real read-only Playwright extraction for public webpages. Separate from the mock simulation; no login, purchases, or form submissions.</p>
<section><label for="api">Backend API URL</label><input id="api" type="url" value="https://tinyfish-browser-core-api.onrender.com" placeholder="https://your-api.onrender.com"><label for="target">Public website URL</label><input id="target" type="url" value="https://example.com"><button id="health">Check backend health</button><button id="extract">Extract live page</button><p id="status">Ready</p></section>
<section><div class="tag">RESPONSE</div><pre id="out">Run a health check or extraction to see the live API response.</pre></section>
<script>
const $=id=>document.getElementById(id);async function call(path,body){let base=$('api').value.trim().replace(/\/+$/,'');try{if(!base)throw Error('Enter the backend URL');if(location.protocol==='https:'&&!base.startsWith('https://'))throw Error('Use an HTTPS backend URL');$('status').textContent='Connecting…';$('health').disabled=$('extract').disabled=true;let r=await fetch(base+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let raw=await r.text(),data;try{data=JSON.parse(raw)}catch{data={detail:raw}}if(!r.ok)throw Error('HTTP '+r.status+': '+(data.detail||raw));$('out').textContent=JSON.stringify(data,null,2);$('status').textContent='Success · '+(data.mode||'API ready')}catch(e){$('out').textContent=JSON.stringify({status:'error',message:e.message},null,2);$('status').textContent='Request failed'}finally{$('health').disabled=$('extract').disabled=false}}$('health').onclick=()=>call('/health');$('extract').onclick=()=>{let url=$('target').value.trim();try{if(!['http:','https:'].includes(new URL(url).protocol))throw Error('Only HTTP/HTTPS URLs supported')}catch(e){$('out').textContent=e.message;return}call('/api/extract',{url,max_chars:12000,timeout_ms:20000})};
</script></main>
