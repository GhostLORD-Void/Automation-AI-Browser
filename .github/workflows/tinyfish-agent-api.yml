name: TinyFish Live Agent API CI

on:
  push:
    branches:
      - feature/tinyfish-live-agent-v1
  pull_request:
    paths:
      - "tinyfish-agent-api/**"
      - ".github/workflows/tinyfish-agent-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinyfish-agent-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tinyfish-agent-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q main.py test_main.py
      - run: pytest -q
