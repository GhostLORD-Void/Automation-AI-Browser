name: TinyFish Integrated CI

on:
  push:
    branches:
      - feature/tinyfish-integrated-web-android-v1
  pull_request:
    paths:
      - "app/**"
      - "tinyfish-agent-api/**"
      - "tinyfish-browser-core/**"
      - ".github/workflows/tinyfish-integrated-ci.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tinyfish-integrated-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinyfish-agent-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tinyfish-agent-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q main.py test_main.py
      - run: pytest -q
